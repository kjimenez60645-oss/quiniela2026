  // Match 10: Netherlands vs Japan
  j1g10: {
    Cristina:"V", Consuelo:"L", Noe:"L", Jessica:"V", David:"V", Diana:"L", Julio:"V", Luis:"L", "Jose D":"L", Patron:"L", "Julio Jr":"V", Andres:"V", Jorge:"E", Papa:"V", KJ:"L", Yuny:"L", Miros:"E", Nacho:"E", Tony:"L", Speedy:"L", "Carlos G":"V", "Miguel C":"L", "Miguel R":"L", Maria:"E", Miguelito:"V", Bryan:"L"
  },
  // Match 11: Ivory Coast vs Ecuador
  j1g11: {
    Cristina:"V", Consuelo:"V", Noe:"L", Jessica:"E", David:"E", Diana:"V", Julio:"L", Luis:"V", "Jose D":"V", Patron:"V", "Julio Jr":"V", Andres:"V", Jorge:"V", Papa:"V", KJ:"V", Yuny:"E", Miros:"V", Nacho:"V", Tony:"E", Speedy:"E", "Carlos G":"L", "Miguel C":"V", "Miguel R":"E", Maria:"V", Miguelito:"E", Bryan:"L"
  },
  // Match 12: Sweden vs Tunisia
  j1g12: {
    Cristina:"L", Consuelo:"E", Noe:"L", Jessica:"V", David:"L", Diana:"L", Julio:"L", Luis:"L", "Jose D":"V", Patron:"L", "Julio Jr":"L", Andres:"L", Jorge:"L", Papa:"V", KJ:"L", Yuny:"L", Miros:"L", Nacho:"L", Tony:"E", Speedy:"E", "Carlos G":"L", "Miguel C":"V", "Miguel R":"L", Maria:"L", Miguelito:"L", Bryan:"E"
  }
  // Los partidos 13 al 24 de Jornada 1, y todas las jornadas 2 y 3 quedan sin pronóstico.
};

const PARTICIPANT_NAMES = [
  "Cristina","Consuelo","Noe","Jessica","David","Diana","Julio","Luis","Jose D","Patron","Julio Jr","Andres","Jorge","Papa","KJ","Yuny","Miros","Nacho","Tony","Speedy","Carlos G","Miguel C","Miguel R","Maria","Miguelito","Bryan"
];
const PARTICIPANT_COLORS = {
  Cristina:"#ec4899", Consuelo:"#f97316", Noe:"#3b82f6", Jessica:"#a855f7", David:"#10b981", Diana:"#f43f5e", Julio:"#eab308", Luis:"#06b6d4", "Jose D":"#8b5cf6", Patron:"#84cc16", "Julio Jr":"#fb923c", Andres:"#14b8a6", Jorge:"#ef4444", Papa:"#f59e0b", KJ:"#6366f1", Yuny:"#d946ef", Miros:"#0ea5e9", Nacho:"#f472b6", Tony:"#22d3ee", Speedy:"#a3e635", "Carlos G":"#34d399", "Miguel C":"#fb7185", "Miguel R":"#818cf8", Maria:"#f0abfc", Miguelito:"#c084fc", Bryan:"#38bdf8"
};

// Construir participantes con sus predicciones (solo las que existen)
const PARTICIPANTS = PARTICIPANT_NAMES.map(name => {
  const predictions = {};
  for (const [gameId, picks] of Object.entries(PREDICTIONS_DATA)) {
    if (picks[name] !== undefined) {
      predictions[gameId] = picks[name];
    }
  }
  return { name, color: PARTICIPANT_COLORS[name], predictions };
});

function calcPoints(participant) {
  let pts = 0, correct = 0, wrong = 0, pending = 0;
  ALL_GAMES.forEach(g => {
    const pick = participant.predictions[g.id];
    if (!pick) { pending++; return; }
    if (g.result === null) { pending++; return; }
    if (pick === g.result) { pts++; correct++; }
    else { wrong++; }
  });
  return { pts, correct, wrong, pending };
}

let ranked = PARTICIPANTS.map(p => ({ ...p, ...calcPoints(p) })).sort((a,b) => b.pts - a.pts || b.correct - a.correct);
ranked.forEach((p,i) => p.rank = i+1);

const playedGamesCount = ALL_GAMES.filter(g => g.result !== null).length;
document.getElementById("gamesPlayed").innerHTML = `${playedGamesCount}/${ALL_GAMES.length} jugados`;

function initials(name) { return name.split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2); }
function labelFor(c) { if(!c) return "—"; return c==="L"?"🏠 Local":c==="E"?"🤝 Empate":"✈️ Visita"; }
function rankIcon(r) { return r===1?"🥇":r===2?"🥈":r===3?"🥉":`#${r}`; }
function rankBgClass(r) { return r===1?"gold-row":r===2?"silver-row":r===3?"bronze-row":"other-row"; }

function buildPodium() {
  document.getElementById("podiumList").innerHTML = ranked.slice(0,3).map(p=>`
    <div class="podium-row ${rankBgClass(p.rank)}" onclick="openModal('${p.name}')">
      <span class="podium-rank">${rankIcon(p.rank)}</span>
      <div class="podium-avatar" style="background:${p.color}22;color:${p.color};border-color:${p.color}55">${initials(p.name)}</div>
      <div class="podium-info"><div class="podium-name">${p.name}</div><div class="podium-pts">✅ ${p.correct} aciertos · ⏳ ${p.pending} pend.</div></div>
      <span class="podium-badge ${p.rank===1?"gold-badge":p.rank===2?"silver-badge":"bronze-badge"}">${p.pts} pts</span>
    </div>`).join("");
}

let currentFilter = "all", searchVal = "";
function buildCards() {
  let list = [...ranked];
  if (currentFilter === "top10") list = list.slice(0,10);
  if (searchVal) list = list.filter(p => p.name.toLowerCase().includes(searchVal.toLowerCase()));
  const container = document.getElementById("cardsList");
  const noRes = document.getElementById("noResults");
  if (!list.length) { container.innerHTML = ""; noRes.style.display = "block"; return; }
  noRes.style.display = "none";
  container.innerHTML = list.map(p=>`
    <div class="player-card" onclick="openModal('${p.name}')">
      <div class="rank-num${p.rank<=3?" top3":""}">${p.rank<=3?rankIcon(p.rank):p.rank}</div>
      <div class="avatar" style="background:${p.color}22;color:${p.color};border-color:${p.color}55">${initials(p.name)}</div>
      <div class="card-info"><div class="card-name">${p.name}</div><div class="card-sub">✅ ${p.correct} aciertos &nbsp;❌ ${p.wrong} fallos &nbsp;⏳ ${p.pending}</div>
        <button class="view-btn" onclick="event.stopPropagation();openModal('${p.name}')"><i class="ti ti-eye"></i> Ver predicciones</button>
      </div>
      <div class="card-right"><div class="pts-big">${p.pts}</div><div class="pts-label">pts</div></div>
    </div>`).join("");
}

window.openModal = function(name) {
  const p = ranked.find(x => x.name === name);
  if (!p) return;
  const av = document.getElementById("modalAvatar");
  av.style.background = p.color+"33";
  av.style.color = p.color;
  av.textContent = initials(p.name);
  document.getElementById("modalName").innerHTML = `${rankIcon(p.rank)} ${p.name}`;
  document.getElementById("modalSub").innerHTML = `Posición #${p.rank} de ${ranked.length} · ${p.correct} aciertos`;
  document.getElementById("modalStats").innerHTML = `
    <div class="stat-box"><div class="stat-num" style="color:#4ade80">${p.correct}</div><div class="stat-lbl">Aciertos</div></div>
    <div class="stat-box"><div class="stat-num" style="color:#f87171">${p.wrong}</div><div class="stat-lbl">Fallos</div></div>
    <div class="stat-box"><div class="stat-num" style="color:#facc15">${p.pts}</div><div class="stat-lbl">Puntos</div></div>`;
  let html = "";
  JORNADAS.forEach(j => {
    html += `<div class="jornada-title">${j.label}</div>`;
    j.games.forEach(g => {
      const pick = p.predictions[g.id] || null;
      let pickClass = "pick-pending";
      let resBadge = "";
      if (g.result && pick) {
        pickClass = pick === g.result ? "pick-correct" : "pick-wrong";
        resBadge = pick === g.result ? `<span class="result-badge res-correct">✅ Acierto</span>` : `<span class="result-badge res-wrong">❌ Fallo</span>`;
      } else if (!g.result) resBadge = `<span class="result-badge res-pending">⏳ Pendiente</span>`;
      else if (!pick) resBadge = `<span class="result-badge res-pending">❓ Sin pronóstico</span>`;
      html += `<div class="game-row">
        <div class="game-teams">${g.home} vs ${g.away} <span class="group-badge">Grupo ${g.group}</span></div>
        <div class="game-picks">
          <div><div class="pick-label">Tu pronóstico</div><div class="pick-val ${pickClass}">${labelFor(pick)}</div></div>
          <div><div class="pick-label">Resultado real</div><div class="pick-val ${g.result ? (pick===g.result ? "pick-correct" : "pick-wrong") : "pick-pending"}">${labelFor(g.result)}</div></div>
        </div>${resBadge}
      </div>`;
    });
  });
  document.getElementById("modalGames").innerHTML = html;
  document.getElementById("predictionsModal").classList.add("open");
};

function openFullPodium() {
  document.getElementById("fullPodiumSub").innerHTML = `${ranked.length} participantes · ${playedGamesCount}/${ALL_GAMES.length} partidos jugados`;
  document.getElementById("fullPodiumList").innerHTML = ranked.map(p=>`
    <div class="podium-row ${rankBgClass(p.rank)}" onclick="closeFull();openModal('${p.name}')">
      <span class="podium-rank" style="font-size:${p.rank>3?'16px':'22px'}">${rankIcon(p.rank)}</span>
      <div class="podium-avatar" style="background:${p.color}22;color:${p.color};border-color:${p.color}44;width:38px;height:38px;font-size:13px">${initials(p.name)}</div>
      <div class="podium-info"><div class="podium-name" style="font-size:14px">${p.name}</div><div class="podium-pts">✅${p.correct} ❌${p.wrong} ⏳${p.pending}</div></div>
      <span style="font-size:16px;font-weight:700;color:#e8c547">${p.pts}<span style="font-size:11px;color:rgba(255,255,255,0.4)"> pts</span></span>
    </div>`).join("");
  document.getElementById("fullPodiumModal").classList.add("open");
}
function closeFull() { document.getElementById("fullPodiumModal").classList.remove("open"); }

document.getElementById("podiumToggleBtn").addEventListener("click",()=>{
  const body = document.getElementById("podiumBody");
  const chevron = document.getElementById("podiumChevron");
  body.classList.toggle("open");
  chevron.style.transform = body.classList.contains("open") ? "" : "rotate(-90deg)";
});
document.getElementById("fullPodiumBtn").addEventListener("click", openFullPodium);
document.getElementById("fullPodiumClose").addEventListener("click", closeFull);
document.getElementById("modalClose").addEventListener("click",()=>document.getElementById("predictionsModal").classList.remove("open"));
document.getElementById("predictionsModal").addEventListener("click",function(e){if(e.target===this)this.classList.remove("open");});
document.getElementById("fullPodiumModal").addEventListener("click",function(e){if(e.target===this)closeFull();});
document.getElementById("searchInput").addEventListener("input",function(){searchVal=this.value;buildCards();});
document.querySelectorAll(".filter-btn").forEach(btn=>{
  btn.addEventListener("click",function(){
    document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
    this.classList.add("active"); currentFilter = this.dataset.filter; buildCards();
  });
});

buildPodium();
buildCards();
</script>
</body>
</html>
