<!DOCTYPE html>
<html lang="es-419">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Quiniela Mundial 2026 · Fase de Grupos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/tabler-icons.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(160deg, #0a1628 0%, #1a3a5c 50%, #0f2340 100%);
      min-height: 100vh;
      color: #fff;
      font-size: 16px;
    }
    .app {
      max-width: 100%;
      margin: 0 auto;
      padding: 0 0 80px;
    }
    /* Header */
    .header {
      background: linear-gradient(135deg, #c9a227 0%, #e8c547 50%, #c9a227 100%);
      padding: 18px 16px 14px;
      text-align: center;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0a1628;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .header p {
      font-size: 13px;
      color: #0a1628cc;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .ball-icon {
      font-size: 32px;
      display: block;
      margin-bottom: 6px;
    }
    /* Search bar */
    .search-wrap {
      padding: 14px 12px 0;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 14px 16px 14px 50px;
      font-size: 17px;
      border-radius: 30px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: #fff;
      outline: none;
    }
    .search-wrap input::placeholder {
      color: rgba(255,255,255,0.7);
      font-size: 15px;
    }
    .search-wrap .si {
      position: absolute;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 24px;
      color: rgba(255,255,255,0.8);
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      padding: 20px 14px 8px;
    }
    /* Podio */
    .podium-section {
      margin: 10px 12px 0;
      background: rgba(255,255,255,0.07);
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .podium-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      user-select: none;
    }
    .podium-label {
      font-size: 14px;
      font-weight: 700;
      color: #e8c547;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .podium-body {
      padding: 0 12px 14px;
      display: none;
    }
    .podium-body.open {
      display: block;
    }
    .podium-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 12px;
      border-radius: 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.1s;
    }
    .podium-row:active {
      opacity: 0.7;
    }
    .podium-rank {
      font-size: 28px;
      width: 44px;
      text-align: center;
      flex-shrink: 0;
    }
    .podium-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.3);
    }
    .podium-info {
      flex: 1;
      min-width: 0;
    }
    .podium-name {
      font-size: 17px;
      font-weight: 600;
    }
    .podium-pts {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
    }
    .podium-badge {
      font-size: 13px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 30px;
      flex-shrink: 0;
    }
    .gold-row { background: linear-gradient(90deg, rgba(201,162,39,0.35), rgba(201,162,39,0.1)); }
    .silver-row { background: linear-gradient(90deg, rgba(180,180,190,0.3), rgba(180,180,190,0.08)); }
    .bronze-row { background: linear-gradient(90deg, rgba(176,107,60,0.35), rgba(176,107,60,0.1)); }
    .other-row { background: rgba(255,255,255,0.05); }
    .gold-badge { background: #c9a227; color: #0a1628; }
    .silver-badge { background: #b4b4c0; color: #1a1a2e; }
    .bronze-badge { background: #b06b3c; color: #fff; }
    /* Tarjetas */
    .cards-section {
      padding: 10px 12px 0;
    }
    .player-card {
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      margin-bottom: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .player-card:active {
      background: rgba(255,255,255,0.2);
    }
    .rank-num {
      font-size: 24px;
      font-weight: 700;
      width: 40px;
      text-align: center;
      color: rgba(255,255,255,0.6);
      flex-shrink: 0;
    }
    .rank-num.top3 {
      color: #e8c547;
    }
    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.2);
    }
    .card-info {
      flex: 1;
    }
    .card-name {
      font-size: 18px;
      font-weight: 700;
    }
    .card-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }
    .view-btn {
      margin-top: 10px;
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      border-radius: 40px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .card-right {
      text-align: right;
      flex-shrink: 0;
    }
    .pts-big {
      font-size: 32px;
      font-weight: 800;
      color: #e8c547;
      line-height: 1;
    }
    .pts-label {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    /* Tabla líderes */
    .standings-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      background: rgba(255,255,255,0.06);
      border-radius: 24px;
      overflow: hidden;
      font-size: 14px;
    }
    .standings-table th, .standings-table td {
      padding: 14px 6px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .standings-table th {
      background: rgba(0,0,0,0.4);
      color: #e8c547;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 13px;
    }
    .standings-table td:first-child, .standings-table th:first-child {
      width: 50px;
    }
    .standings-table td:nth-child(2) {
      text-align: left;
      font-weight: 600;
    }
    .standings-table tr {
      cursor: pointer;
    }
    .standings-table tr:hover {
      background: rgba(255,255,255,0.12);
    }
    .table-rank-1 { background: rgba(201,162,39,0.25); }
    .table-rank-2 { background: rgba(180,180,190,0.2); }
    .table-rank-3 { background: rgba(176,107,60,0.2); }
    .table-pts {
      font-weight: 800;
      color: #e8c547;
      font-size: 17px;
    }
    /* Matriz La Tabla */
    .matrix-container {
      overflow-x: auto;
      margin: 12px 12px 0;
      background: rgba(255,255,255,0.06);
      border-radius: 24px;
      padding: 10px 0;
    }
    .matrix-table {
      border-collapse: collapse;
      font-size: 13px;
      min-width: 800px;
    }
    .matrix-table th, .matrix-table td {
      padding: 10px 6px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.12);
      vertical-align: middle;
    }
    .matrix-table th {
      background: rgba(0,0,0,0.5);
      color: #e8c547;
      position: sticky;
      top: 0;
      z-index: 10;
      font-weight: 700;
      font-size: 12px;
    }
    .matrix-table td {
      font-weight: 600;
    }
    .matrix-pred-L { background: #22c55e30; color: #86efac; }
    .matrix-pred-E { background: #eab30830; color: #fde047; }
    .matrix-pred-V { background: #f9731630; color: #fdba74; }
    .matrix-pred-none { background: rgba(255,255,255,0.05); color: #9ca3af; }
    .participant-row:hover {
      background: rgba(255,255,255,0.12);
      cursor: pointer;
    }
    .scroll-hint {
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      margin-top: 6px;
      letter-spacing: 1px;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      background: rgba(0,0,0,0.3);
      padding: 10px 12px;
      border-radius: 40px;
      margin: 8px 12px 0;
      font-size: 13px;
      font-weight: 500;
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .legend .box {
      display: inline-block;
      width: 22px;
      height: 22px;
      border-radius: 6px;
    }
    .filter-row {
      display: flex;
      gap: 10px;
      padding: 12px 12px 4px;
      overflow-x: auto;
    }
    .filter-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.85);
      border-radius: 40px;
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-btn.active {
      background: #c9a227;
      color: #0a1628;
      border-color: #c9a227;
    }
    .fullscreen-btn {
      background: rgba(201,162,39,0.2);
      border: 1px solid rgba(201,162,39,0.4);
      color: #e8c547;
      border-radius: 30px;
      padding: 5px 12px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .games-badge {
      font-size: 12px;
      background: rgba(255,255,255,0.15);
      color: #ddd;
      border-radius: 30px;
      padding: 4px 12px;
      margin-left: 8px;
    }
    .group-badge {
      font-size: 10px;
      background: rgba(0,0,0,0.5);
      border-radius: 20px;
      padding: 2px 8px;
      margin-left: 8px;
      font-weight: 400;
    }
    /* MODAL MEJORADO PARA MÓVIL */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      touch-action: pan-y; /* previene pull-to-refresh en el overlay */
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-sheet {
      background: #0f2340;
      border-radius: 28px 28px 0 0;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 0 0 20px;
      touch-action: pan-y; /* permite scroll vertical dentro del modal sin recargar */
      position: relative;
    }
    .modal-handle {
      width: 60px;
      height: 6px;
      background: rgba(255,255,255,0.35);
      border-radius: 4px;
      margin: 14px auto;
      cursor: grab;
    }
    .modal-handle:active {
      cursor: grabbing;
    }
    .modal-header {
      padding: 6px 20px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: relative;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 800;
      padding-right: 40px;
    }
    .modal-sub {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }
    .modal-close {
      position: absolute;
      right: 18px;
      top: 12px;
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .modal-close:active {
      background: rgba(255,255,255,0.3);
    }
    .modal-body {
      padding: 20px;
    }
    .close-bottom-btn {
      display: block;
      width: calc(100% - 40px);
      margin: 20px auto 10px;
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      border-radius: 40px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }
    .close-bottom-btn:active {
      background: rgba(255,255,255,0.25);
    }
    .jornada-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #e8c547;
      margin: 20px 0 10px;
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(201,162,39,0.4);
    }
    .game-row {
      background: rgba(255,255,255,0.08);
      border-radius: 18px;
      margin-bottom: 10px;
      padding: 12px 14px;
    }
    .game-teams {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .game-picks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .pick-label {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .pick-val {
      font-size: 14px;
      font-weight: 700;
      padding: 8px;
      border-radius: 12px;
      text-align: center;
    }
    .pick-correct { background: #22c55e30; color: #86efac; border: 1px solid #22c55e60; }
    .pick-wrong { background: #ef444430; color: #fca5a5; border: 1px solid #ef444460; }
    .pick-pending { background: rgba(255,255,255,0.08); color: #ccc; border: 1px solid rgba(255,255,255,0.15); }
    .result-badge { font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: 700; display: inline-block; margin-top: 8px; }
    .res-correct { background: #166534; color: #86efac; }
    .res-wrong { background: #7f1d1d; color: #fca5a5; }
    .res-pending { background: rgba(255,255,255,0.1); color: #aaa; }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-box {
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 12px;
      text-align: center;
    }
    .stat-num { font-size: 28px; font-weight: 800; }
    .stat-lbl { font-size: 11px; color: rgba(255,255,255,0.6); text-transform: uppercase; margin-top: 4px; }
    .no-results {
      text-align: center;
      color: rgba(255,255,255,0.5);
      padding: 40px;
      font-size: 16px;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header"><span class="ball-icon">⚽</span><h1>Quiniela 2026</h1><p>Copa del Mundo · Fase de Grupos · $20</p></div>
  <div class="search-wrap"><i class="ti ti-search si"></i><input type="text" id="searchInput" placeholder="Buscar participante..." autocomplete="off"></div>
  <div class="filter-row">
    <button class="filter-btn active" data-view="cards">👥 Participantes</button>
    <button class="filter-btn" data-view="table">🏆 Líderes</button>
    <button class="filter-btn" data-view="matrix">📊 La Tabla</button>
  </div>
  <div class="section-title">🏆 Podio</div>
  <div class="podium-section">
    <div class="podium-header">
      <div><span class="podium-label">🥇 Clasificación</span><span class="games-badge" id="gamesPlayed"></span></div>
      <div style="display:flex; gap:8px"><button class="fullscreen-btn" id="fullPodiumBtn"><i class="ti ti-arrows-maximize"></i> Ampliar</button><button style="background:rgba(255,255,255,0.1); border:none; border-radius:30px; padding:4px 12px; cursor:pointer;" id="podiumToggleBtn"><i class="ti ti-chevron-down" id="podiumChevron"></i></button></div>
    </div>
    <div class="podium-body open" id="podiumBody"><div id="podiumList"></div></div>
  </div>
  <div class="section-title">⚽ Quiniela Mundialista 2026 – Fase de Grupos</div>
  <div id="cardsList" class="cards-section"></div>
  <div id="tableView" class="cards-section" style="display:none;"></div>
  <div id="matrixView" style="display:none;"></div>
  <div class="no-results" id="noResults" style="display:none;">No se encontró ese participante 🔍</div>
</div>

<!-- MODAL PREDICCIONES MEJORADO -->
<div class="modal-overlay" id="predictionsModal">
  <div class="modal-sheet">
    <div class="modal-handle" id="modalHandle"></div>
    <div class="modal-header">
      <button class="modal-close" id="modalClose">✕</button>
      <div id="modalAvatar" style="width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;margin-bottom:12px"></div>
      <div class="modal-title" id="modalName"></div>
      <div class="modal-sub" id="modalSub"></div>
    </div>
    <div class="modal-body" id="modalBodyContent">
      <div class="stats-row" id="modalStats"></div>
      <div id="modalGames"></div>
      <button class="close-bottom-btn" id="modalCloseBottom">Cerrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="fullPodiumModal"><div class="modal-sheet"><div class="modal-handle"></div><div class="modal-header"><button class="modal-close" id="fullPodiumClose">×</button><div class="modal-title">🏟️ Clasificación Completa</div><div class="modal-sub" id="fullPodiumSub"></div></div><div class="modal-body" id="fullPodiumList"></div></div></div>

  const predictions = {};
  for (const [gameId, picks] of Object.entries(PREDICTIONS_DATA)) if (picks[name] !== undefined) predictions[gameId] = picks[name];
  return { name, color: PARTICIPANT_COLORS[name], predictions };
});

function calcPoints(p) {
  let pts=0, correct=0, wrong=0, pending=0;
  ALL_GAMES.forEach(g => {
    const pick = p.predictions[g.id];
    if (!pick) { pending++; return; }
    if (g.result === null) { pending++; return; }
    if (pick === g.result) { pts++; correct++; } else wrong++;
  });
  return { pts, correct, wrong, pending };
}
let ranked = PARTICIPANTS.map(p => ({ ...p, ...calcPoints(p) })).sort((a,b)=>b.pts - a.pts || b.correct - a.correct);

function initials(n){ return n.split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2); }

function rankIcon(r){ return r===1?"🥇":r===2?"🥈":r===3?"🥉":`#${r}`; }
function rankBgClass(r){ return r===1?"gold-row":r===2?"silver-row":r===3?"bronze-row":"other-row"; }

}

function renderCards(){

  if (searchVal) list = list.filter(p=>p.name.toLowerCase().includes(searchVal.toLowerCase()));
  const container = document.getElementById("cardsList");
  const noRes = document.getElementById("noResults");
  if(!list.length){ container.innerHTML=""; noRes.style.display="block"; return; }
  noRes.style.display="none";
  container.innerHTML = list.map(p=>`
    <div class="player-card" onclick="openModal('${p.name}')">
      <div class="rank-num${p.rank<=3?" top3":""}">${p.rank<=3?rankIcon(p.rank):p.rank}</div>
      <div class="avatar" style="background:${p.color}22;color:${p.color};border-color:${p.color}55">${initials(p.name)}</div>

      </div>
      <div class="card-right"><div class="pts-big">${p.pts}</div><div class="pts-label">pts</div></div>

}
function renderTable(){
  let list = [...ranked];
  if (searchVal) list = list.filter(p=>p.name.toLowerCase().includes(searchVal.toLowerCase()));
  const container = document.getElementById("tableView");
  const noRes = document.getElementById("noResults");
  if(!list.length){ container.innerHTML=""; noRes.style.display="block"; return; }
  noRes.style.display="none";
  let html = `<table class="standings-table"><thead><tr><th>#</th><th>Participante</th><th>✅</th><th>❌</th><th>⏳</th><th>Pts</th></tr></thead><tbody>`;
  list.forEach(p=>{
    let rowClass = "";
    if(p.rank===1) rowClass="table-rank-1";
    else if(p.rank===2) rowClass="table-rank-2";
    else if(p.rank===3) rowClass="table-rank-3";
    html += `<tr class="${rowClass}" onclick="openModal('${p.name}')"><td>${p.rank}</td><td style="text-align:left">${p.name}</td><td>${p.correct}</td><td>${p.wrong}</td><td>${p.pending}</td><td class="table-pts">${p.pts} pts</td></tr>`;
  });
  html += `</tbody></table>`;
  container.innerHTML = html;
}
function renderMatrix(){
  let filtered = [...ranked];
  if (searchVal) filtered = filtered.filter(p=>p.name.toLowerCase().includes(searchVal.toLowerCase()));
  const container = document.getElementById("matrixView");
  const noRes = document.getElementById("noResults");
  if(!filtered.length){ container.innerHTML=""; noRes.style.display="block"; return; }
  noRes.style.display="none";
  const allMatches = ALL_GAMES;
  let html = `<div class="legend"><span><div class="box" style="background:#22c55e60;"></div> 🟢 Local (L)</span><span><div class="box" style="background:#eab30860;"></div> 🟡 Empate (E)</span><span><div class="box" style="background:#f9731660;"></div> 🟠 Visita (V)</span><span><div class="box" style="background:rgba(255,255,255,0.2);"></div> ⚪ Sin predicción</span></div><div class="matrix-container"><div class="scroll-hint">← desliza para ver más →</div><table class="matrix-table"><thead><tr><th>Participante</th>`;
  allMatches.forEach(m => { html += `<th title="${m.home} vs ${m.away} (Grupo ${m.group})">${m.home} vs ${m.away}</th>`; });
  html += `</tr></thead><tbody>`;
  filtered.forEach(p => {
    html += `<tr class="participant-row" onclick="openModal('${p.name}')"><td style="text-align:left;font-weight:700">${p.name}</td>`;
    allMatches.forEach(m => {
      const pred = p.predictions[m.id];
      let cellClass = "matrix-pred-none", cellText = "—";
      if(pred === "L") { cellClass = "matrix-pred-L"; cellText = "L"; }
      else if(pred === "E") { cellClass = "matrix-pred-E"; cellText = "E"; }
      else if(pred === "V") { cellClass = "matrix-pred-V"; cellText = "V"; }
      html += `<td class="${cellClass}">${cellText}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div>`;
  container.innerHTML = html;
}
function setView(view){
  currentView = view;
  const cardsDiv = document.getElementById("cardsList");
  const tableDiv = document.getElementById("tableView");
  const matrixDiv = document.getElementById("matrixView");
  cardsDiv.style.display = view==="cards" ? "block" : "none";
  tableDiv.style.display = view==="table" ? "block" : "none";
  matrixDiv.style.display = view==="matrix" ? "block" : "none";
  if(view==="cards") renderCards();
  else if(view==="table") renderTable();
  else if(view==="matrix") renderMatrix();
}

window.openModal = function(name){

  av.style.background = p.color+"33"; av.style.color=p.color; av.textContent=initials(p.name);
  document.getElementById("modalName").innerHTML = `${rankIcon(p.rank)} ${p.name}`;
  document.getElementById("modalSub").innerHTML = `Posición #${p.rank} de ${ranked.length} · ${p.correct} aciertos`;
  document.getElementById("modalStats").innerHTML = `<div class="stat-box"><div class="stat-num" style="color:#4ade80">${p.correct}</div><div class="stat-lbl">Aciertos</div></div><div class="stat-box"><div class="stat-num" style="color:#f87171">${p.wrong}</div><div class="stat-lbl">Fallos</div></div><div class="stat-box"><div class="stat-num" style="color:#facc15">${p.pts}</div><div class="stat-lbl">Puntos</div></div>`;
  let html = "";
  JORNADAS.forEach(j=>{
    html+=`<div class="jornada-title">${j.label}</div>`;
    j.games.forEach(g=>{
      const pick = p.predictions[g.id]||null;
      let pickClass="pick-pending", resBadge="";
      if(g.result && pick){ pickClass=pick===g.result?"pick-correct":"pick-wrong"; resBadge=pick===g.result?`<span class="result-badge res-correct">✅ Acierto</span>`:`<span class="result-badge res-wrong">❌ Fallo</span>`; }
      else if(!g.result) resBadge=`<span class="result-badge res-pending">⏳ Pendiente</span>`;
      else if(!pick) resBadge=`<span class="result-badge res-pending">❓ Sin predicción</span>`;
      html+=`<div class="game-row"><div class="game-teams">${g.home} vs ${g.away} <span class="group-badge">Grupo ${g.group}</span></div><div class="game-picks"><div><div class="pick-label">Tu predicción</div><div class="pick-val ${pickClass}">${labelFor(pick)}</div></div><div><div class="pick-label">Resultado real</div><div class="pick-val ${g.result?(pick===g.result?"pick-correct":"pick-wrong"):"pick-pending"}">${labelFor(g.result)}</div></div></div>${resBadge}</div>`;
    });
  });
  document.getElementById("modalGames").innerHTML = html;
  document.getElementById("predictionsModal").classList.add("open");
};
function openFullPodium(){
  document.getElementById("fullPodiumSub").innerHTML = `${ranked.length} participantes · ${playedGamesCount}/${ALL_GAMES.length} partidos jugados`;
  document.getElementById("fullPodiumList").innerHTML = ranked.map(p=>`<div class="podium-row ${rankBgClass(p.rank)}" onclick="closeFull();openModal('${p.name}')"><span class="podium-rank" style="font-size:${p.rank>3?'18px':'28px'}">${rankIcon(p.rank)}</span><div class="podium-avatar" style="background:${p.color}22;color:${p.color};width:42px;height:42px;font-size:15px">${initials(p.name)}</div><div class="podium-info"><div class="podium-name">${p.name}</div><div class="podium-pts">✅${p.correct} ❌${p.wrong} ⏳${p.pending}</div></div><span style="font-size:18px;font-weight:800;color:#e8c547">${p.pts} pts</span></div>`).join("");
  document.getElementById("fullPodiumModal").classList.add("open");
}
function closeFull(){ document.getElementById("fullPodiumModal").classList.remove("open"); }
document.getElementById("podiumToggleBtn").addEventListener("click",()=>{
  const body = document.getElementById("podiumBody");
  const chevron = document.getElementById("podiumChevron");
  body.classList.toggle("open");
  chevron.style.transform = body.classList.contains("open") ? "" : "rotate(-90deg)";
});
document.getElementById("fullPodiumBtn").addEventListener("click", openFullPodium);
document.getElementById("fullPodiumClose").addEventListener("click", closeFull);
// Cierres modales mejorados
document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("modalCloseBottom").addEventListener("click", closeModal);
document.getElementById("predictionsModal").addEventListener("click", function(e){ if(e.target === this) closeModal(); });
document.getElementById("fullPodiumModal").addEventListener("click",function(e){if(e.target===this)closeFull();});
buildPodium();
setView("cards");
</script>
</body>
</html>
